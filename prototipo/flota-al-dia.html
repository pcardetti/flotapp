<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flota al Día</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: herramienta de taller. Barra lateral fija con módulos + área de trabajo; en celular la barra pasa a pestañas arriba. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8ecf1; --ink:#142133; --ink-2:#47566a; --ink-3:#6b7889; --line:#d3dae3;
  --accent:#1d4f91; --accent-ink:#ffffff; --accent-soft:#dfe9f7; --road:#e0a400;
  --ok:#1d7349; --ok-soft:#dcf0e4; --warn:#9a5a00; --warn-soft:#fbecd0; --crit:#b42318; --crit-soft:#fbe0dc;
  --s1:#2a78d6; --s2:#eb6834;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(20,33,51,.06),0 4px 16px rgba(20,33,51,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131b; --surface:#151d28; --surface-2:#1e2836; --ink:#e6ecf3; --ink-2:#a9b5c3; --ink-3:#8492a3; --line:#2a3646;
  --accent:#86b4f2; --accent-ink:#0b1320; --accent-soft:#1b2d46; --road:#f0bf3a;
  --ok:#62cf95; --ok-soft:#12301f; --warn:#f2b65c; --warn-soft:#3a2a10; --crit:#ff8b80; --crit-soft:#3f1715;
  --s1:#3987e5; --s2:#d95926; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131b; --surface:#151d28; --surface-2:#1e2836; --ink:#e6ecf3; --ink-2:#a9b5c3; --ink-3:#8492a3; --line:#2a3646;
  --accent:#86b4f2; --accent-ink:#0b1320; --accent-soft:#1b2d46; --road:#f0bf3a;
  --ok:#62cf95; --ok-soft:#12301f; --warn:#f2b65c; --warn-soft:#3a2a10; --crit:#ff8b80; --crit-soft:#3f1715;
  --s1:#3987e5; --s2:#d95926; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.1rem;letter-spacing:.03em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.muted{color:var(--ink-3)} .small{font-size:.85rem}
.eyebrow{font:600 .75rem/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;max-width:1440px;margin:0 auto;padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:6px;padding:4px 10px 14px;border-bottom:2px dashed var(--road)}
.brand b{font:700 1.6rem/1 var(--display);letter-spacing:.02em}
.brand span{font-size:.8rem;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:8px;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.badge{min-width:22px;padding:1px 7px;border-radius:999px;font-size:.75rem;font-weight:600;text-align:center;background:var(--crit-soft);color:var(--crit)}
.nav button[aria-current="page"] .badge{background:var(--accent-ink);color:var(--accent)}
.side-foot{font-size:.78rem;color:var(--ink-3);padding:0 10px}

main{min-width:0;display:flex;flex-direction:column;gap:22px}
.view-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.view-head .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:.9rem}
.banner.warn{background:var(--warn-soft)}
#banner:empty{display:none}
#banner{display:flex;flex-direction:column;gap:8px;margin-bottom:-6px}

.btn{cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:600;font-size:.9rem;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.55;cursor:default}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:.88rem}
.linkbtn:hover{text-decoration:underline}
body.readonly .w{display:none!important}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .v{font:700 2rem/1.05 var(--display)}
.stat .d{font-size:.84rem;color:var(--ink-2)}
.stat.alert{border-color:var(--crit)}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.kpi b{font:700 1.4rem/1.1 var(--display)}
.kpi span{font-size:.8rem;color:var(--ink-3)}

.attn{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.attn li{display:grid;grid-template-columns:9.5rem minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.attn li:first-child{border-top:0}
.attn li>.pill{justify-self:start}
@media (max-width:520px){.attn li{grid-template-columns:minmax(0,1fr) auto}.attn li>.pill{grid-column:1/-1}}
.attn .what{display:flex;flex-direction:column;gap:2px;min-width:0}
.attn .what b{font-weight:600}
.attn .what span{font-size:.85rem;color:var(--ink-3)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill b{font-size:.72rem}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--accent)}

.plate{display:inline-flex;align-items:center;justify-content:center;background:#ffffff;color:#111111;border:1.5px solid #1b1b1b;border-top:5px solid #1f4fa8;border-radius:4px;padding:2px 7px 1px;font:600 .92rem/1.2 var(--display);letter-spacing:.09em;white-space:nowrap}
.plate.old{background:#141414;color:#f1f1f1;border-color:#6d6d6d;border-top-width:1.5px}
.unit-cell{display:flex;align-items:center;gap:10px;min-width:0}
.unit-cell .m{display:flex;flex-direction:column;min-width:0}
.unit-cell .m span{font-size:.82rem;color:var(--ink-3)}

.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
td .sub{display:block;font-size:.8rem;color:var(--ink-3)}
.row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.input,select.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.search{flex:1 1 220px;max-width:340px}

.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.85rem;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--ink-3);stroke-width:1}
.chart .tick{fill:var(--ink-3);font:500 11px var(--body)}
.chart .dlabel{fill:var(--ink);font:600 12px var(--body)}
.chart .s1{fill:var(--s1)} .chart .s2{fill:var(--s2)}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hit:hover{fill:var(--ink);fill-opacity:.05}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:.82rem;min-width:170px;transform:translate(-50%,-100%)}
.tip div{display:flex;justify-content:space-between;gap:12px}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.88rem}
details[open] summary{margin-bottom:8px}

.empty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:26px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface)}
.empty h2{font-size:1.6rem}
.empty p{max-width:60ch;color:var(--ink-2)}

/* Neumáticos */
.truck{display:flex;flex-direction:column;gap:14px;padding:18px 10px;align-items:center;overflow-x:auto}
.axle{display:grid;grid-template-columns:auto minmax(16px,1fr) auto;align-items:center;gap:8px;width:100%;max-width:400px}
.axle .bar{height:6px;border-radius:3px;background:var(--line);position:relative}
.axle .bar span{position:absolute;inset:-18px 0 auto;text-align:center;font:600 .72rem var(--body);color:var(--ink-3);letter-spacing:.06em}
.side-t{display:flex;gap:4px}
.tcode{font:600 .9rem/1 var(--display);letter-spacing:.06em;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:3px 6px;white-space:nowrap}
.tcode.big{font-size:1.05rem;padding:4px 8px}
.tire b small{font:600 .62rem var(--body);margin-left:1px;color:var(--ink-3)}
.tire em.code{font-size:.66rem;letter-spacing:.03em}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.tl li{position:relative;display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px}
.tl li::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--ink-3)}
.tl li.tl-montaje::before,.tl li.tl-alta::before{border-color:var(--accent);background:var(--accent)}
.tl li.tl-recapado::before{border-color:var(--ok);background:var(--ok)}
.tl li.tl-envio::before,.tl li.tl-rotacion::before{border-color:var(--warn)}
.tl li.tl-baja::before{border-color:var(--crit);background:var(--crit)}
.tl-f{font-size:.82rem;color:var(--ink-3);padding-top:1px}
.tl li div{display:flex;flex-direction:column;gap:1px;min-width:0}
.tl li div span{font-size:.86rem;color:var(--ink-2)}
.tire{cursor:pointer;width:64px;height:92px;border-radius:9px;border:2px solid var(--ink-2);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;font-size:.72rem;color:var(--ink-2);
  background-image:repeating-linear-gradient(0deg,transparent 0 7px,var(--surface-2) 7px 9px)}
.tire b{font:700 1.05rem/1 var(--display);color:var(--ink);background:var(--surface);padding:1px 3px;border-radius:3px}
.tire em{font-style:normal;background:var(--surface);padding:0 3px;border-radius:3px}
.tire.ok{border-color:var(--ok)} .tire.warn{border-color:var(--warn);background-color:var(--warn-soft)} .tire.crit{border-color:var(--crit);background-color:var(--crit-soft)}
.tire.none{border-style:dashed;border-color:var(--line);background-image:none;color:var(--ink-3)}
.cab{font:600 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:8px 8px 3px 3px;padding:6px 26px;background:var(--surface-2)}

/* Control diario */
.ck-items{display:flex;flex-direction:column}
.ck-item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.ck-item:first-child{border-top:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:6px 11px;font-size:.82rem;font-weight:600;color:var(--ink-2);border-left:1px solid var(--line)}
.seg label:first-child span{border-left:0}
.seg input:checked+span.ok{background:var(--ok-soft);color:var(--ok)}
.seg input:checked+span.warn{background:var(--warn-soft);color:var(--warn)}
.seg input:checked+span.crit{background:var(--crit-soft);color:var(--crit)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:.82rem;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:.78rem;color:var(--ink-3)}
.field textarea{min-height:76px;resize:vertical}
.check{flex-direction:row;align-items:center;gap:8px}
.check input{width:18px;height:18px}
.form-err{color:var(--crit);font-size:.88rem;font-weight:600}
.note{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.85rem;color:var(--ink-2)}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,25,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 40px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;width:100%;max-width:620px;box-shadow:var(--shadow);border:1px solid var(--line)}
.sheet.wide{max-width:920px}
.m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.m-head .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.m-body{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.m-body.form-grid{display:grid}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px}
.icon-btn{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;font-size:1.4rem;color:var(--ink-3)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.dl div{display:flex;flex-direction:column;gap:2px}
.dl dt{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.dl dd{margin:0;font-weight:600}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
#toast:empty{display:none}

@media (max-width:1080px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px;padding-top:0}
  .side{top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);gap:8px;padding-top:12px;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
  .brand{flex-direction:row;align-items:baseline;gap:10px;padding:0 0 8px;border-bottom:0}
  .brand b{font-size:1.35rem}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
  .nav button{flex:0 0 auto;padding:7px 12px}
  .side-foot{display:none}
  .dl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  h1{font-size:1.7rem}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .stat .v{font-size:1.65rem}
  .modal{padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.nav button{transition:background-color .12s,border-color .12s}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><b>Flota al Día</b><span>Mantenimiento de camiones</span></div>
    <nav class="nav" id="nav" aria-label="Módulos"></nav>
    <p class="side-foot">Montos en pesos nominales. Plazos normativos editables en Ajustes.</p>
  </aside>
  <div style="min-width:0;display:flex;flex-direction:column;gap:22px">
    <div id="banner"></div>
    <main id="main"><p class="muted">Conectando con los datos de la flota…</p></main>
  </div>
</div>
<div id="modal" class="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- utilidades ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5;
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoy=()=>iso(new Date());
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=parse(s);d.setMonth(d.getMonth()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/DAY);
const fFecha=s=>s?parse(s).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
const fNum=n=>Number(n).toLocaleString('es-AR');

const ARS=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});

/* ---------- almacenamiento ---------- */
async function put(col,id,data){
  try{
    if(mode==='demo'){
      if(col==='config'){S.config={...data};}
      else{const a=S[col],i=a.findIndex(x=>x.id===id);const doc={id,...data};if(i>=0)a[i]=doc;else a.push(doc);}
      schedule();return true;
    }
    await db.collection(col).doc(id).set(stripId(data));return true;
  }catch(e){return fail(e)}
}
async function patch(col,id,data){
  try{
    if(mode==='demo'){
      if(col==='config'){S.config={...(S.config||{}),...data};}
      else{const a=S[col],i=a.findIndex(x=>x.id===id);if(i>=0)a[i]={...a[i],...data};}
      schedule();return true;
    }
    await db.collection(col).doc(id).update(stripId(data));return true;
  }catch(e){return fail(e)}
}
async function del(col,id){
  try{
    if(mode==='demo'){S[col]=S[col].filter(x=>x.id!==id);schedule();return true;}
    await db.collection(col).doc(id).delete();return true;
  }catch(e){return fail(e)}
}
function stripId(d){const c={...d};delete c.id;return c}
function fail(e){
  const code=e&&e.code;
  if(code==='invalid_argument'&&mode==='db'){canWrite=false;schedule();toast('No tenés permiso para modificar estos datos.');}
  else if(code==='quota_exceeded')toast('Se llenó el espacio de datos. Borrá registros viejos para seguir cargando.');
  else toast('No se pudo guardar. Probá de nuevo en unos segundos.');
  return false;
}
async function setKm(unidadId,km,fecha){
  const u=unitById(unidadId);if(!u||km==null||km==='')return;
  km=Number(km);if(!(km>(u.km||0)))return;
  const h=(u.kmHistorial||[]).slice();h.push({f:fecha||hoy(),km});
  await patch('unidades',unidadId,{km,kmHistorial:h.slice(-60)});
}

/* ---------- cálculos ---------- */
function planEstado(p){
  const u=unitById(p.unidadId),c=cfg();let kmFalta=null,diasFalta=null;
  if(p.cadaKm&&u&&u.km!=null&&p.ultimoKm!=null)kmFalta=p.ultimoKm+p.cadaKm-u.km;
  if(p.cadaDias&&p.ultimaFecha)diasFalta=diff(addDays(p.ultimaFecha,p.cadaDias),hoy());
  let est='ok';
  if((kmFalta!=null&&kmFalta<=0)||(diasFalta!=null&&diasFalta<=0))est='vencido';
  else if((kmFalta!=null&&kmFalta<=c.avisoKm)||(diasFalta!=null&&diasFalta<=c.avisoDias))est='proximo';
  const r=Math.min(kmFalta!=null?kmFalta/p.cadaKm:9,diasFalta!=null?diasFalta/p.cadaDias:9);
  return {kmFalta,diasFalta,est,r};
}
function docEstado(d){
  const dias=diff(d.vence,hoy()),t=tipoById(d.tipoId),aviso=t&&t.avisoDias!=null?t.avisoDias:30;
  return {dias,est:dias<0?'vencido':dias<=aviso?'proximo':'ok'};
}
function neuEstado(n){const m=cfg().profundidadMin;return n.profundidad==null?'':n.profundidad<=m?'crit':n.profundidad<=m+2?'warn':'ok'}
function kmRecorridos(u,desde){
  const h=(u.kmHistorial||[]).slice().sort((a,b)=>a.f<b.f?-1:1);
  if(!h.length||u.km==null)return 0;
  let base=h[0];for(const r of h)if(r.f<=desde)base=r;
  return Math.max(0,u.km-base.km);
}
function kpis(){
  const H=hoy(),desde=addDays(H,-365);
  const cerr=S.ordenes.filter(o=>o.estado==='cerrada'&&(o.fechaEgreso||o.fechaIngreso)>=desde);
  const total=cerr.reduce((a,o)=>a+costo(o),0);
  const prev=cerr.filter(o=>o.tipo==='preventivo').reduce((a,o)=>a+costo(o),0);
  const kmRec=S.unidades.filter(tieneMotor).reduce((a,u)=>a+kmRecorridos(u,desde),0);
  const corr=cerr.filter(o=>o.tipo==='correctivo'&&o.fechaEgreso);
  const mttr=corr.length?corr.reduce((a,o)=>a+Math.max(0,diff(o.fechaEgreso,o.fechaIngreso)),0)/corr.length:null;
  const d30=S.ordenes.filter(o=>o.estado==='cerrada'&&(o.fechaEgreso||o.fechaIngreso)>=addDays(H,-30)).reduce((a,o)=>a+costo(o),0);
  return {total,pctPrev:total?prev/total*100:null,porKm:kmRec?total/kmRec:null,kmRec,mttr,d30};
}

  const L=[],H=hoy(),c=cfg();
  S.documentos.forEach(d=>{const e=docEstado(d),t=tipoById(d.tipoId);if(e.est==='ok')return;
    L.push({sev:e.est==='vencido'?'crit':'warn',lbl:e.est==='vencido'?'Vencido':'Por vencer',t:(t?t.nombre:'Documento')+' · '+titularTxt(d),s:(e.est==='vencido'?'Venció ':'Vence ')+plazo(e.dias)+' ('+fFecha(d.vence)+')',v:'vencimientos',o:e.dias});});
  S.planes.forEach(p=>{const e=planEstado(p),u=unitById(p.unidadId);if(e.est==='ok'||!u||u.estado==='baja')return;
    L.push({sev:e.est==='vencido'?'crit':'warn',lbl:e.est==='vencido'?'Service vencido':'Service próximo',t:p.tarea+' · '+u.dominio,s:faltanTxt(e),v:'mantenimiento',o:e.r*100});});
  S.checklists.forEach(k=>{const f=Object.entries(k.items||{}).filter(([,v])=>v==='falla');if(!f.length||k.otId||k.fecha<addDays(H,-7))return;const u=unitById(k.unidadId);
    L.push({sev:'crit',lbl:'Falla reportada',t:f.map(([x])=>itemNombre(x)).join(', ')+' · '+(u?u.dominio:''),s:'Control diario del '+fFecha(k.fecha)+(k.obs?': '+k.obs:''),v:'checklist',o:-50});});
  NEU().forEach(n=>{if(n.estado!=='montado'||neuEstado(n)!=='crit')return;const u=unitById(n.unidadId);
    L.push({sev:'warn',lbl:'Neumático gastado',t:n.codigo+' en '+n.posicion+' · '+(u?u.dominio:''),s:fNum(n.profundidad)+' mm de dibujo (mínimo configurado '+fNum(c.profundidadMin)+' mm)',v:'neumaticos',o:0,u:n.unidadId});});
  S.ordenes.forEach(o=>{if(o.estado!=='abierta')return;const d=diff(H,o.fechaIngreso);if(d<7)return;const u=unitById(o.unidadId);
    L.push({sev:'warn',lbl:'Orden demorada',t:'OT '+o.numero+' · '+(u?u.dominio:''),s:o.descripcion+' · abierta hace '+d+' días',v:'ordenes',o:-d});});
  return L.sort((a,b)=>(a.sev===b.sev?a.o-b.o:a.sev==='crit'?-1:1));
}
const itemNombre=k=>(ITEMS.find(i=>i[0]===k)||[k,k])[1];
function titularTxt(d){if(d.entidad==='chofer'){const c=choferById(d.refId);return c?c.nombre:'Chofer eliminado'}const u=unitById(d.refId);return u?u.dominio:'Unidad eliminada'}
function faltanTxt(e){
  const p=[];
  if(e.kmFalta!=null)p.push(e.kmFalta>=0?'faltan '+fNum(e.kmFalta)+' km':'pasado por '+fNum(-e.kmFalta)+' km');
  if(e.diasFalta!=null)p.push(e.diasFalta>=0?(e.diasFalta===0?'vence hoy':'faltan '+e.diasFalta+' días'):'vencido hace '+(-e.diasFalta)+' días');
  return p.join(' · ')||'Sin datos de último service';
}

function niceMax(v){const p=10**Math.floor(Math.log10(v));for(const m of [1,2,2.5,5,10])if(m*p>=v)return m*p;return v}
function topRound(x,y,w,h,r){r=Math.min(r,h,w/2);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function chartCostos(){
  const base=parse(hoy()),M=[];
  for(let i=5;i>=0;i--){const d=new Date(base.getFullYear(),base.getMonth()-i,1);M.push({y:d.getFullYear(),m:d.getMonth(),label:d.toLocaleDateString('es-AR',{month:'short'}).replace('.',''),largo:d.toLocaleDateString('es-AR',{month:'long',year:'numeric'}),prev:0,corr:0})}
  S.ordenes.filter(o=>o.estado==='cerrada').forEach(o=>{const f=parse(o.fechaEgreso||o.fechaIngreso),k=M.find(x=>x.y===f.getFullYear()&&x.m===f.getMonth());if(k)k[o.tipo==='preventivo'?'prev':'corr']+=costo(o)});
  const max=Math.max(...M.map(x=>x.prev+x.corr));CHART=M;
  if(!max)return `<p class="muted">Todavía no hay órdenes cerradas con costos en los últimos 6 meses.</p>`;
  const top=niceMax(max),W=640,Hh=230,pl=62,pr=8,pt=22,pb=28,pw=W-pl-pr,ph=Hh-pt-pb,slot=pw/6,bw=Math.min(46,slot*.5),y=v=>pt+ph-(v/top)*ph;
  let g='';
  for(let t=0;t<=4;t++){const v=top*t/4,yy=y(v);if(t)g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" class="grid"/>`;g+=`<text x="${pl-8}" y="${yy+4}" text-anchor="end" class="tick">${fCorto(v)}</text>`}
  M.forEach((k,i)=>{const cx=pl+slot*i+slot/2,x=cx-bw/2,yb=y(0),hp=k.prev/top*ph,hc=k.corr/top*ph;
    if(k.prev>0)g+=k.corr>0?`<rect x="${x}" y="${yb-hp}" width="${bw}" height="${hp}" class="s1"/>`:`<path d="${topRound(x,yb-hp,bw,hp,4)}" class="s1"/>`;
    if(k.corr>0){const yc=yb-hp-(k.prev>0?2:0)-hc;g+=`<path d="${topRound(x,yc,bw,hc,4)}" class="s2"/>`}
    g+=`<text x="${cx}" y="${Hh-8}" text-anchor="middle" class="tick">${esc(k.label)}</text>`});
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" class="base"/>`;
  const lt=M[5].prev+M[5].corr;if(lt>0)g+=`<text x="${pl+slot*5.5}" y="${y(lt)-8}" text-anchor="middle" class="dlabel">${fCorto(lt)}</text>`;
  M.forEach((k,i)=>g+=`<rect x="${pl+slot*i}" y="${pt}" width="${slot}" height="${ph}" class="hit" data-i="${i}"/>`);
  return `<div class="legend"><span><i style="background:var(--s1)"></i>Preventivo</span><span><i style="background:var(--s2)"></i>Correctivo</span></div>
  <div class="chart" id="chart"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Costo mensual de mantenimiento, preventivo y correctivo, últimos 6 meses">${g}</svg><div class="tip" id="tip" hidden></div></div>
  <details><summary>Ver como tabla</summary><div class="tbl-wrap"><table><thead><tr><th>Mes</th><th class="num">Preventivo</th><th class="num">Correctivo</th><th class="num">Total</th></tr></thead><tbody>${M.map(k=>`<tr><td>${esc(k.largo)}</td><td class="num">${fPesos(k.prev)}</td><td class="num">${fPesos(k.corr)}</td><td class="num">${fPesos(k.prev+k.corr)}</td></tr>`).join('')}</tbody></table></div></details>`;
}
function wireChart(){
  const ch=document.getElementById('chart');if(!ch||!CHART)return;const tip=document.getElementById('tip'),svg=ch.querySelector('svg');
  ch.querySelectorAll('.hit').forEach(r=>{
    r.addEventListener('mouseenter',()=>{const k=CHART[+r.dataset.i],bb=r.getBoundingClientRect(),cb=ch.getBoundingClientRect();
      tip.innerHTML=`<b>${esc(k.largo)}</b><div><span>Preventivo</span><span>${fPesos(k.prev)}</span></div><div><span>Correctivo</span><span>${fPesos(k.corr)}</span></div><div><span>Total</span><b>${fPesos(k.prev+k.corr)}</b></div>`;
      tip.hidden=false;const left=Math.min(Math.max(bb.left-cb.left+bb.width/2,90),cb.width-90);tip.style.left=left+'px';tip.style.top=(bb.top-cb.top+8)+'px'});
    r.addEventListener('mouseleave',()=>tip.hidden=true)});
}

function avisosUnidad(id){
  let crit=0,warn=0;
  S.documentos.filter(d=>d.entidad==='unidad'&&d.refId===id).forEach(d=>{const e=docEstado(d).est;if(e==='vencido')crit++;else if(e==='proximo')warn++});
  S.planes.filter(p=>p.unidadId===id).forEach(p=>{const e=planEstado(p).est;if(e==='vencido')crit++;else if(e==='proximo')warn++});
  return {crit,warn};
}

function ejes(u){
  if(!u)return [];
  if(u.tipo==='tractor'||u.tipo==='chasis')return [['E1',false],['E2',true]];
  if(u.tipo==='acoplado')return [['E1',true],['E2',true]];
  return [['E1',true],['E2',true],['E3',true]];
}
function vNeumaticos(){
  if(!S.unidades.length&&!S.neumaticos.length)return vacio();
  return `<div class="view-head"><div class="t"><span class="eyebrow">Cada neumático con su código y su historia</span><h1>Neumáticos</h1></div>

}
function neuUbic(n){
  if(n.estado==='montado'){const u=unitById(n.unidadId);return u?`<span class="unit-cell">${plate(u.dominio)}<span>${esc(n.posicion)}</span></span>`:'—'}

  if(n.estado==='recapado')return pill('warn','↻','En recapadora')+(n.proveedor?`<span class="sub">${esc(n.proveedor)}</span>`:'');

const vidaTxt=n=>'Vida '+(n.recapados+1)+(n.recapados?' · '+n.recapados+(n.recapados===1?' recapado':' recapados'):' · nuevo');
function neuPorUnidad(){
  if(!S.unidades.length)return '<p class="muted">Cargá unidades para ver sus ejes.</p>';

  if(!UI.neuU||!unitById(UI.neuU)){const conN=S.unidades.slice().sort(byDominio).find(u=>all.some(n=>n.estado==='montado'&&n.unidadId===u.id));UI.neuU=(conN||S.unidades.slice().sort(byDominio)[0]).id}

  const tire=pos=>{const n=ns.find(x=>x.posicion===pos);if(!n)return `<button class="tire none" data-act="neu-pos" data-pos="${pos}" aria-label="Montar neumático en ${pos}"><em>${pos}</em><span class="w">Montar</span></button>`;
    return `<button class="tire ${neuEstado(n)}" data-act="neu-ver" data-id="${n.id}" aria-label="${pos}: ${esc(n.codigo)}, ${fNum(n.profundidad)} milímetros"><em>${pos}</em><b>${n.profundidad!=null?fNum(n.profundidad):'?'}<small>mm</small></b><em class="code">${esc(n.codigo)}</em></button>`};
  const axles=ejes(u).map(([e,dual])=>`<div class="axle"><div class="side-t">${dual?tire(e+'-IE')+tire(e+'-II'):tire(e+'-I')}</div><div class="bar"><span>${e}</span></div><div class="side-t">${dual?tire(e+'-DI')+tire(e+'-DE'):tire(e+'-D')}</div></div>`).join('');

      <div class="legend"><span>${pill('ok','✓','Más de '+fNum(c.profundidadMin+2)+' mm')}</span><span>${pill('warn','!','Hasta '+fNum(c.profundidadMin+2)+' mm')}</span><span>${pill('crit','✕','Mínimo '+fNum(c.profundidadMin)+' mm o menos')}</span></div>
      <p class="small muted">Tocá un neumático para ver su historia, medirlo, rotarlo o desmontarlo. I = izquierdo, D = derecho; en duales, E = exterior e I = interior.</p>
    </section>
    <section class="card"><div class="card-head"><h2>Para reemplazar o recapar</h2><span class="small muted">Toda la flota</span></div>
      ${bajos.length?`<div class="tbl-wrap"><table><thead><tr><th>Código</th><th>Ubicación</th><th class="num">Dibujo</th><th>Vida</th></tr></thead><tbody>${bajos.map(x=>`<tr class="clickable" data-act="neu-ver" data-id="${x.n.id}"><td><b class="tcode">${esc(x.n.codigo)}</b><span class="sub">${esc(x.n.marca||'')}</span></td><td>${neuUbic(x.n)}</td><td class="num">${fNum(x.n.profundidad)} mm</td><td>${x.n.recapados+1}</td></tr>`).join('')}</tbody></table></div>`:`<p class="muted">Ningún neumático montado está por debajo del mínimo configurado.</p>`}
      <p class="note">El mínimo de alerta (${fNum(c.profundidadMin)} mm) se cambia en Ajustes. No reemplaza el control del límite legal ni la recomendación del fabricante.</p>
    </section>

function neuInventario(){

const modal=document.getElementById('modal'),sheet=document.getElementById('sheet');
function openModal(wide){sheet.className='sheet'+(wide?' wide':'');modal.hidden=false;document.body.style.overflow='hidden';setTimeout(()=>{const f=sheet.querySelector('input:not([type=hidden]),select,textarea,button.btn.primary');if(f)f.focus()},20)}
function closeModal(){modal.hidden=true;modalKind=null;modalId=null;sheet.innerHTML='';document.body.style.overflow=''}
modal.addEventListener('mousedown',e=>{if(e.target===modal)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeModal()});

function fieldHTML(f){
  const id='f-'+f.name,v=f.value==null?'':f.value,cls='field'+(f.full?' full':'');
  if(f.type==='note')return `<p class="note field full">${f.html}</p>`;
  if(f.type==='checkbox')return `<label class="${cls} check" for="${id}"><input type="checkbox" id="${id}"${v?' checked':''}><span>${esc(f.label)}</span></label>`;
  let inp;
  if(f.type==='select'){
    const opt=o=>`<option value="${esc(o.v)}"${String(o.v)===String(v)?' selected':''}>${esc(o.l)}</option>`;
    inp=`<select class="input" id="${id}">${f.blank!=null?`<option value="">${esc(f.blank)}</option>`:''}${f.groups?f.groups.filter(g=>g.options.length).map(g=>`<optgroup label="${esc(g.label)}">${g.options.map(opt).join('')}</optgroup>`).join(''):f.options.map(opt).join('')}</select>`;
  }else if(f.type==='textarea')inp=`<textarea class="input" id="${id}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
  else inp=`<input class="input" id="${id}" type="${f.type||'text'}" value="${esc(v)}"${f.type==='number'?` inputmode="decimal" step="${f.step||'any'}" min="0"`:''} placeholder="${esc(f.ph||'')}">`;
  return `<div class="${cls}"><label for="${id}">${esc(f.label)}${f.required?'':' <span class="muted">(opcional)</span>'}</label>${inp}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`;
}

const ocupante=(uid,pos)=>NEU().find(x=>x.estado==='montado'&&x.unidadId===uid&&x.posicion===pos);
const kmUnidad=u=>tieneMotor(u)&&u.km!=null?u.km:null;
/* Posición vacía: elegir uno del depósito o dar de alta uno nuevo */
function tireClick(pos){
  if(!canWrite)return;
  const u=unitById(UI.neuU),dep=NEU().filter(n=>n.estado==='deposito').sort((a,b)=>a.codigo.localeCompare(b.codigo,'es',{numeric:true}));
  modalKind='form';
  sheet.innerHTML=`<header class="m-head"><div class="t"><h2>Montar en ${esc(pos)}</h2><p class="small muted">${esc(u.dominio)} · ${esc(u.marca)} ${esc(u.modelo)}</p></div><button type="button" class="icon-btn" data-act="close" aria-label="Cerrar">×</button></header>
  <div class="m-body"><div class="sec"><h3>Desde el depósito</h3>
    ${dep.length?`<div class="tbl-wrap"><table><tbody>${dep.map(n=>`<tr><td><b class="tcode">${esc(n.codigo)}</b><span class="sub">${esc(n.marca)} ${esc(n.medida||'')}</span></td><td>${esc(vidaTxt(n))}<span class="sub">${n.profundidad!=null?fNum(n.profundidad)+' mm':''}</span></td><td><div class="row-actions"><button class="btn sm primary" data-act="neu-montar-dep" data-id="${n.id}" data-pos="${pos}">Montar</button></div></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted small">No hay neumáticos en el depósito.</p>'}</div></div>
  <footer class="m-foot"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn" data-act="neu-alta" data-pos="${pos}">Alta de neumático nuevo</button></footer>`;
  openModal();
}
async function montarNeu(n,uid,pos,fecha){
  const u=unitById(uid),f=fecha||hoy(),km=kmUnidad(u);
  return patch('neumaticos',n.id,{estado:'montado',unidadId:uid,posicion:pos,kmMontaje:km,fechaMontaje:f,proveedor:'',
    historial:hist(n,{f,tipo:'montaje',detalle:'Montado en '+u.dominio+' · '+pos+(km!=null?' · '+fKm(km):''),unidadId:uid,posicion:pos})});
}
async function moverNeu(n,uid,pos){
  const f=hoy(),u=unitById(uid),un=unitById(n.unidadId),o=ocupante(uid,pos);
  const reubicar=(x,uu,p,txt)=>({...cerrarSeg(x),unidadId:uu.id,posicion:p,kmMontaje:kmUnidad(uu),fechaMontaje:f,historial:hist(x,{f,tipo:'rotacion',detalle:txt,unidadId:uu.id,posicion:p})});
  if(!await patch('neumaticos',n.id,reubicar(n,u,pos,'De '+(un?un.dominio:'')+' '+n.posicion+' a '+u.dominio+' '+pos+(o?' (intercambio con '+o.codigo+')':''))))return false;
  if(o)await patch('neumaticos',o.id,reubicar(o,un,n.posicion,'De '+u.dominio+' '+pos+' a '+un.dominio+' '+n.posicion+' (intercambio con '+n.codigo+')'));
  return true;
}
async function sacarNeu(n,destino,v){
  const f=v.fecha||hoy(),u=unitById(n.unidadId),s=segKm(n);
  const txt=[destino==='deposito'?'Al depósito':null,n.estado==='montado'&&u?'Desde '+u.dominio+' '+n.posicion:null,v.motivo||null,s?fKm(s)+' en este montaje':null].filter(Boolean).join(' · ')||'Sin detalle';
  return patch('neumaticos',n.id,{...cerrarSeg(n),estado:destino,unidadId:'',posicion:'',kmMontaje:null,
    profundidad:v.profundidad!=null?v.profundidad:(n.profundidad??null),proveedor:destino==='recapado'?(v.motivo||''):'',
    historial:hist(n,{f,tipo:destino==='baja'?'baja':destino==='recapado'?'envio':'desmontaje',detalle:txt})});
}
function openNeu(id){modalKind='neu';modalId=id;renderNeuModal();openModal(true)}

  const n=neuById(modalId);if(!n){closeModal();return}

    montado:`<button class="btn" data-act="neu-mover" data-id="${n.id}">Mover o rotar</button><button class="btn" data-act="neu-sacar" data-id="${n.id}">Desmontar</button><button class="btn primary" data-act="neu-medir" data-id="${n.id}">Registrar medición</button>`,
    deposito:`<button class="btn" data-act="neu-sacar" data-id="${n.id}" data-dest="recapado">Enviar a recapar</button><button class="btn" data-act="neu-sacar" data-id="${n.id}" data-dest="baja">Dar de baja</button><button class="btn primary" data-act="neu-mover" data-id="${n.id}">Montar</button>`,
    recapado:`<button class="btn primary" data-act="neu-recibir" data-id="${n.id}">Recibir de la recapadora</button>`,

  <div class="m-body">
    <dl class="dl" style="margin:0"><div><dt>Vida</dt><dd>${esc(vidaTxt(n))}</dd></div><div><dt>Dibujo</dt><dd>${n.profundidad!=null?fNum(n.profundidad)+' mm':'—'}<span class="small muted"> · ${fFecha(n.fechaMedicion)}</span></dd></div><div><dt>Km totales</dt><dd>${kmTot(n)?fKm(kmTot(n)):'—'}<span class="small muted"> · esta vida ${fKm(kmVidaAct(n))}</span></dd></div><div><dt>Costo por km</dt><dd>${fCostoKm(costoKm(n))}<span class="small muted"> · ${fPesos(n.costoTotal)} invertidos</span></dd></div></dl>
    <div class="actions w" style="flex-wrap:wrap">${acc}<button class="btn ghost" data-act="neu-editar" data-id="${n.id}">Editar datos</button></div>

      ${n.historial.length?`<ol class="tl">${n.historial.slice().reverse().map(e=>`<li class="tl-${esc(e.tipo)}"><span class="tl-f">${fFecha(e.f)}</span><div><b>${esc(TL[e.tipo]||e.tipo)}</b><span>${esc(e.detalle||'')}</span></div></li>`).join('')}</ol>`:'<p class="muted small">Sin eventos registrados. Los neumáticos cargados antes de esta versión empiezan su historia con el próximo movimiento.</p>'}
    </div>

function formAltaNeu(pos){
  const u=pos?unitById(UI.neuU):null;
  openForm({title:pos?'Alta y montaje en '+pos:'Alta de neumático',sub:pos?esc(u.dominio):'Queda en el depósito hasta que lo montes.',fields:[
    {name:'codigo',label:'Código',value:sigCodigo(),required:true,hint:'El número marcado a fuego o uno propio. No se puede repetir.'},
    {name:'marca',label:'Marca',required:true,ph:'Fate, Pirelli, Bridgestone…'},
    {name:'medida',label:'Medida',value:'295/80 R22.5',required:true},
    {name:'profundidad',label:'Profundidad de dibujo (mm)',type:'number',required:true,step:'0.1'},
    {name:'recapados',label:'Recapados previos',type:'number',value:0,step:1,hint:'Si es usado y ya fue recapado.'},
    {name:'precio',label:'Precio de compra ($)',type:'number',step:1}
  ],validate:v=>NEU().some(n=>n.codigo.toUpperCase()===v.codigo.toUpperCase())?'Ya existe un neumático con el código '+v.codigo+'.':null,
  onSubmit:async v=>{
    const f=hoy(),id=newId(),codigo=v.codigo.toUpperCase();
    const base={codigo,marca:v.marca,medida:v.medida,profundidad:v.profundidad,recapados:v.recapados||0,precio:v.precio||0,costoTotal:v.precio||0,kmTotal:0,kmVida:0,estado:'deposito',unidadId:'',posicion:'',kmMontaje:null,fechaMontaje:null,fechaMedicion:f,proveedor:'',
      historial:[{f,tipo:'alta',detalle:v.marca+' '+v.medida+(v.recapados?' · '+v.recapados+' recapados previos':'')+(v.precio?' · '+fPesos(v.precio):'')}]};
    if(!await put('neumaticos',id,base))return false;
    if(pos)await montarNeu({id,...base},u.id,pos,f);
    toast(pos?codigo+' montado en '+pos:codigo+' dado de alta');
  }});
}
function formMoverNeu(n){
  const groups=S.unidades.filter(u=>u.estado!=='baja').sort(byDominio).map(u=>({label:u.dominio+' · '+u.marca+' '+u.modelo,options:posiciones(u).map(p=>{
    if(n.unidadId===u.id&&n.posicion===p)return null;const o=ocupante(u.id,p);
    if(!o)return {v:u.id+'|'+p,l:p+' · libre'};
    return n.estado==='montado'&&o.unidadId===n.unidadId?{v:u.id+'|'+p,l:p+' · intercambiar con '+o.codigo}:null}).filter(Boolean)}));
  openForm({title:n.estado==='montado'?'Mover o rotar '+n.codigo:'Montar '+n.codigo,sub:n.estado==='montado'?'Si elegís una posición ocupada de la misma unidad, los dos neumáticos se intercambian.':'',fields:[
    {name:'destino',label:'Posición',type:'select',required:true,blank:'Elegí unidad y posición',groups,full:true}
  ],onSubmit:async v=>{const [uid,pos]=v.destino.split('|');const ok=n.estado==='montado'?await moverNeu(n,uid,pos):await montarNeu(n,uid,pos);if(ok)toast(n.codigo+' en '+unitById(uid).dominio+' '+pos);return ok}});
}

  const opts=[{v:'deposito',l:'Al depósito'},{v:'recapado',l:'A la recapadora'},{v:'baja',l:'Dar de baja'}].filter(o=>n.estado==='montado'||o.v!=='deposito');
  openForm({title:n.estado==='montado'?'Desmontar '+n.codigo:(dest==='baja'?'Dar de baja '+n.codigo:'Enviar a recapar '+n.codigo),fields:[
    {name:'destino',label:'Destino',type:'select',value:dest||'deposito',required:true,options:opts},
    {name:'fecha',label:'Fecha',type:'date',value:hoy(),required:true},
    {name:'profundidad',label:'Dibujo al desmontar (mm)',type:'number',step:'0.1',value:n.profundidad},

}

/* Control diario */
async function guardarChecklist(){
  const d=ckDraft(),err=document.getElementById('ck-err');
  if(!d.unidadId){err.textContent='Elegí la unidad que controlaste.';err.hidden=false;return}
  const km=d.km===''?null:Number(d.km),id=newId();
  const ok=await put('checklists',id,{unidadId:d.unidadId,choferId:d.choferId,fecha:hoy(),km,items:{...d.items},obs:d.obs.trim(),otId:null});
  if(!ok)return;
  if(km!=null)await setKm(d.unidadId,km);
  UI.ck=null;UI.ckResult=id;toast('Control guardado');schedule();
}
function otDesdeChecklist(id){
  const k=S.checklists.find(x=>x.id===id);if(!k)return;
  const f=Object.entries(k.items).filter(([,v])=>v==='falla').map(([x])=>itemNombre(x));
  formOT({unidadId:k.unidadId,tipo:'correctivo',descripcion:'Falla en control diario: '+f.join(', ')+(k.obs?'. '+k.obs:''),checklistId:k.id,enTaller:true});
}

/* Datos de ejemplo */
async function cargarEjemplo(btn){
  const ex=ejemplo(),tareas=[];
  for(const col of COLS)for(const doc of ex[col]){if(col==='tiposDoc'&&S.tiposDoc.some(t=>t.id===doc.id))continue;tareas.push([col,doc])}
  if(!S.config)tareas.push(['config',{id:'general',avisoKm:2000,avisoDias:15,profundidadMin:3}]);
  let i=0;const b=btn||document.getElementById('btn-ejemplo');if(b)b.disabled=true;
  const worker=async()=>{while(i<tareas.length){const [col,doc]=tareas[i++];if(!await put(col,doc.id,stripId(doc)))throw 0;if(b)b.textContent='Cargando… '+Math.min(i,tareas.length)+' de '+tareas.length}};
  try{await Promise.all([worker(),worker(),worker()]);toast('Flota de ejemplo cargada');go('panel')}catch(e){if(b){b.disabled=false;b.textContent='Cargar flota de ejemplo'}}
}
async function borrarEjemplo(){
  openConfirm({title:'Borrar datos de ejemplo',text:'Se eliminan las unidades, choferes, órdenes, documentos, neumáticos y controles de ejemplo. Lo que cargaste vos no se toca. Los tipos de documento se conservan.',ok:'Borrar',onOk:async()=>{
    for(const col of COLS){if(col==='tiposDoc')continue;for(const d of S[col].filter(x=>x.ejemplo).slice())await del(col,d.id)}
    toast('Datos de ejemplo borrados')}});
}
async function empezar(){
  for(const t of TIPOS_DOC_SUGERIDOS)if(!S.tiposDoc.some(x=>x.id===t.id))await put('tiposDoc',t.id,stripId(t));
  if(!S.config)await put('config','general',{avisoKm:2000,avisoDias:15,profundidadMin:3});
  go('flota');formUnidad();
}

document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.ui&&t.type==='search'){UI[t.dataset.ui]=t.value;render()}
  else if(t.dataset.ck){ckDraft()[t.dataset.ck]=t.value}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.ui&&t.type!=='search'){UI[t.dataset.ui]=t.value;render()}
  else if(t.dataset.ckItem){ckDraft().items[t.dataset.ckItem]=t.value}
  else if(t.dataset.ck){ckDraft()[t.dataset.ck]=t.value;if(t.dataset.ck==='unidadId'){UI.ckResult=null;render()}}});

/* ---------- render ---------- */
const main=document.getElementById('main'),nav=document.getElementById('nav'),bannerEl=document.getElementById('banner');
const VIEW_FN={panel:vPanel,flota:vFlota,mantenimiento:vMantenimiento,ordenes:vOrdenes,vencimientos:vVencimientos,neumaticos:vNeumaticos,checklist:vChecklist,ajustes:vAjustes};
function go(v){if(!VIEW_FN[v])v='panel';UI.view=v;if(v!=='checklist')UI.ckResult=null;try{history.replaceState(null,'','#'+v)}catch(e){}render();window.scrollTo({top:0})}
let pend=false;function schedule(){if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;render()})}
function render(){
  document.body.classList.toggle('readonly',!canWrite);
  const vencidos=S.documentos.filter(d=>docEstado(d).est==='vencido').length,pv=S.planes.filter(p=>planEstado(p).est==='vencido').length,ab=S.ordenes.filter(o=>o.estado==='abierta').length;
  const badge={vencimientos:vencidos,mantenimiento:pv,ordenes:ab};
  nav.innerHTML=VIEWS.map(([v,l])=>`<button data-act="nav" data-v="${v}"${UI.view===v?' aria-current="page"':''}><span>${l}</span>${badge[v]?`<span class="badge"${v==='ordenes'?' style="background:var(--surface-2);color:var(--ink-2)"':''}>${badge[v]}</span>`:''}</button>`).join('');
  const b=[];
  if(mode==='demo')b.push(`<div class="banner warn"><span><b>Modo demostración.</b> Estás viendo una flota de ejemplo y los cambios no se guardan. Abrí la app publicada en claude.ai para guardar los datos de tu flota.</span></div>`);
  else if(mode==='db'&&COLS.some(k=>S[k].some(x=>x.ejemplo)))b.push(`<div class="banner"><span>Estás viendo <b>datos de ejemplo</b>. Borralos desde Ajustes cuando empieces a cargar tu flota.</span><button class="linkbtn w" data-act="nav" data-v="ajustes">Ir a Ajustes</button></div>`);
  if(!canWrite)b.push(`<div class="banner"><span>Tenés acceso de lectura. Para cargar datos, pedile al dueño de la app acceso de colaborador.</span></div>`);
  bannerEl.innerHTML=b.join('');
  if(mode==='loading'){main.innerHTML='<p class="muted">Conectando con los datos de la flota…</p>';return}
  const a=document.activeElement,aid=a&&a.id&&main.contains(a)?a.id:null;let s1=null,s2=null;try{s1=a.selectionStart;s2=a.selectionEnd}catch(e){}
  main.innerHTML=VIEW_FN[UI.view]();
  wireChart();
  if(aid){const n=document.getElementById(aid);if(n){n.focus({preventScroll:true});try{if(s1!=null)n.setSelectionRange(s1,s2)}catch(e){}}}
  if(modalKind==='unidad')renderUnidadModal();
  else if(modalKind==='neu')renderNeuModal();
}
let toastT;function toast(t){const el=document.getElementById('toast');el.textContent=t;clearTimeout(toastT);toastT=setTimeout(()=>el.textContent='',3200)}

/* ---------- arranque ---------- */
(async function init(){
  const h=(location.hash||'').slice(1);if(VIEW_FN[h])UI.view=h;
  render();
  let cdb=null;
  try{cdb=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){cdb=null}
  if(!cdb){mode='demo';const ex=ejemplo();COLS.forEach(k=>S[k]=ex[k]);S.config={avisoKm:2000,avisoDias:15,profundidadMin:3};render();return}
  db=cdb;
  try{const user=await window.claude.use('user');if(user&&user.can){const c=await user.can('data.write');if(c===false)canWrite=false}}catch(e){}
  const done=()=>{if(loaded.size>=COLS.length+1&&mode==='loading'){mode='db'}schedule()};
  COLS.forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));loaded.add(c);done()},e=>{loaded.add(c);done()}));
  db.doc('config/general').onSnapshot(s=>{S.config=s.exists?{...s.data()}:null;loaded.add('config');done()},e=>{loaded.add('config');done()});
})();
</script>
